<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMIL Invest</title>
    <!-- Nye FILNAVN (ikke ?v=), fordi Safari lagrer ikoner til startside,
         søkeforslag og bokmerker i et eget arkiv som er nøklet på domenet
         alene og ignorerer query-strengen. Ny sti = friskt ikon.
         apple-touch-icon er helt ugjennomsiktig — iOS gjør transparente
         hjørner svarte og legger på sin egen maske. -->
    <link rel="icon" href="/favicon-gronn.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-gronn.png" sizes="256x256" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-gronn.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Profilfargen. Styrer nettleserlinjen på Android/Chrome og
         statuslinjen når siden ligger på hjemskjermen på iOS. -->
    <meta name="theme-color" content="#2A3A35" />
    <meta name="apple-mobile-web-app-title" content="EMIL Invest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="description" content="Investeringskomiteen for Energi- og miljøstudenter. Investeringer for fremtiden." />
    <meta name="author" content="EMIL Invest" />

    <!-- Delingsbilde. Nytt FILNAVN fordi Safari, iMessage, Slack og
         Facebook cacher og:image på URL i lang tid — gammel blå versjon
         med pil på N-en ville ellers hengt igjen. -->
    <meta property="og:site_name" content="EMIL Invest" />
    <meta property="og:title" content="EMIL Invest" />
    <meta property="og:description" content="Investeringskomiteen for Energi- og miljøstudenter. Investeringer for fremtiden." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:url" content="https://emilinvest.no/" />
    <meta property="og:image" content="https://emilinvest.no/og-image-gronn.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EMIL Invest" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EMIL Invest" />
    <meta name="twitter:description" content="Investeringskomiteen for Energi- og miljøstudenter. Investeringer for fremtiden." />
    <meta name="twitter:image" content="https://emilinvest.no/og-image-gronn.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
